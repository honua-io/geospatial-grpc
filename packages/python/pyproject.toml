[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-grpc"
version = "1.0.0"
description = "Generated Python bindings for the geospatial.v1 gRPC protocol"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Geospatial gRPC Standard Contributors" }]
keywords = ["geospatial", "grpc", "protobuf", "gis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "grpcio>=1.81.1,<2",
  "protobuf>=7.35.1,<8",
]

[project.urls]
Homepage = "https://github.com/honua-io/geospatial-grpc"
Repository = "https://github.com/honua-io/geospatial-grpc"
Changelog = "https://github.com/honua-io/geospatial-grpc/blob/trunk/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geospatial*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
