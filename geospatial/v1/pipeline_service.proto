syntax = "proto3";

package geospatial.v1;

import "geospatial/v1/common.proto";
import "geospatial/v1/execution_types.proto";

// PipelineService provides typed RPC access to data publishing pipeline execution.
//
// This service covers the execution lifecycle for publishing workflows:
// pipeline validation, dry-run estimation, synchronous and asynchronous execution,
// and job management for data ingestion, transformation, and publication.
//
// Transport-neutral status mapping for server implementations:
//
// Request-phase failures (returned as non-OK gRPC status, no response body):
//   INVALID_ARGUMENT    — malformed requests or invalid pipeline definitions on
//                         ExecutePipeline/ExecutePipelineStream/SubmitPipelineJob (re-validation at execution time)
//   PERMISSION_DENIED   — authorization or policy failures
//   NOT_FOUND           — unknown source, target, or job references
//   RESOURCE_EXHAUSTED  — quota or rate-limit exceeded
//   FAILED_PRECONDITION — job not in expected state for the requested operation
//   INTERNAL            — unexpected server errors
//
// Note: ValidatePipeline and DryRunPipeline always return gRPC status OK with a
// structured response containing valid=false and populated issues when
// validation fails. They do not use INVALID_ARGUMENT for definition issues.
//
// Execution-phase failures (after execution begins) are returned with gRPC
// status OK: unary RPCs populate the response error field; streaming RPCs
// send a terminal error event. This ensures the structured ErrorDetail is
// always available to the client. DEADLINE_EXCEEDED and CANCELLED may still
// arrive as gRPC-level codes from client deadlines or transport cancellation.
service PipelineService {
  // ValidatePipeline checks a pipeline definition for structural and capability issues.
  rpc ValidatePipeline(ValidatePipelineRequest) returns (ValidateResponse);

  // DryRunPipeline estimates the cost and impact of executing a pipeline without side effects.
  rpc DryRunPipeline(DryRunPipelineRequest) returns (DryRunResponse);

  // ExecutePipeline runs a pipeline synchronously and returns the result.
  rpc ExecutePipeline(ExecutePipelineRequest) returns (ExecutePipelineResponse);

  // ExecutePipelineStream runs a pipeline and streams progress events and the final result.
  rpc ExecutePipelineStream(ExecutePipelineRequest) returns (stream PipelineEvent);

  // SubmitPipelineJob submits a pipeline for asynchronous execution and returns a job handle.
  rpc SubmitPipelineJob(SubmitPipelineJobRequest) returns (SubmitJobResponse);

  // GetPipelineJob retrieves the current state and progress of a submitted pipeline job.
  rpc GetPipelineJob(GetJobRequest) returns (GetJobResponse);

  // GetPipelineJobResult retrieves the results of a completed pipeline job.
  rpc GetPipelineJobResult(GetJobResultRequest) returns (GetPipelineJobResultResponse);

  // CancelPipelineJob requests cancellation of a running or pending pipeline job.
  rpc CancelPipelineJob(CancelJobRequest) returns (CancelJobResponse);
}

// PipelineDefinition describes a data publishing pipeline.
message PipelineDefinition {
  string pipeline_id = 1;
  string spec_version = 2;
  DataSourceRef source = 3;
  repeated PipelineStage stages = 4;
  PublishTarget target = 5;
  repeated SchemaMapping schema_mappings = 6;
  repeated QualityRule quality_rules = 7;
}

// DataSourceRef identifies the input data source for a pipeline.
message DataSourceRef {
  string source_id = 1;
  string source_type = 2; // e.g., feature_service, file, database
  string locator = 3; // URL or connection reference
  map<string, string> properties = 4;
}

// PipelineStage describes a single stage within a publishing pipeline.
// Standard stage kinds: inspect_source, infer_schema, map_schema,
// normalize_crs, clean_records, dedupe, enrich, quality_check, publish_service.
message PipelineStage {
  string stage_id = 1;
  string kind = 2;
  map<string, ParameterValue> config = 3;
  repeated string dependencies = 4;
}

// PublishTarget describes where pipeline output should be published.
message PublishTarget {
  string target_id = 1;
  string target_type = 2; // e.g., feature_service, map_service
  string name = 3;
  SpatialReference target_spatial_reference = 4;
  map<string, string> properties = 5;
}

// SchemaMapping describes how a source field maps to a target field.
message SchemaMapping {
  string source_field = 1;
  string target_field = 2;
  FieldType target_type = 3;
  string transform_expression = 4;
}

// QualityRule defines a data quality check to apply during pipeline execution.
message QualityRule {
  string rule_id = 1;
  string rule_type = 2; // e.g., completeness, uniqueness, validity
  string field = 3;
  string expression = 4;
  string message = 5;
  Severity severity = 6;
}

// ValidatePipelineRequest asks the server to check a pipeline definition.
message ValidatePipelineRequest {
  PipelineDefinition pipeline = 1;
}

// DryRunPipelineRequest asks the server to estimate pipeline execution impact.
message DryRunPipelineRequest {
  PipelineDefinition pipeline = 1;
}

// ExecutePipelineRequest submits a pipeline for synchronous or streaming execution.
message ExecutePipelineRequest {
  PipelineDefinition pipeline = 1;
  ExecutionContext context = 2;
  // Optional client-generated idempotency key. When set, the server MUST treat
  // a retry carrying the same key within its dedup window as the same execution
  // and return the original result instead of executing the pipeline again, so a
  // retry after a lost response cannot publish duplicate outputs.
  // Recommended: a UUID per logical execution attempt.
  string idempotency_key = 3;
}

// ExecutePipelineResponse returns the complete result of synchronous pipeline execution.
// The gRPC status is OK regardless of execution outcome. On success, only
// result is populated; on terminal failure, only error is populated.
message ExecutePipelineResponse {
  string job_id = 1;
  oneof outcome {
    PipelineResult result = 2;
    ErrorDetail error = 3;
  }
}

// PipelineEvent is a streaming message carrying progress, stage, result, or error events.
message PipelineEvent {
  oneof event {
    JobProgress progress = 1;
    StageResult stage_result = 2;
    PipelineResult result = 3;
    ErrorDetail error = 4;
  }
}

// PipelineResult contains the output of a completed pipeline execution.
message PipelineResult {
  string result_id = 1;
  JobState status = 2;
  string summary = 3;
  SourceLineage source_lineage = 4;
  QualityReport quality_report = 5;
  PublishedServiceInfo published_service = 6;
  repeated ArtifactRef artifacts = 7;
  repeated StageResult stage_results = 8;
  ProvenanceRecord provenance = 9;
}

// SourceLineage describes the source data processed by a pipeline.
message SourceLineage {
  DataSourceRef source = 1;
  int64 record_count = 2;
  repeated FieldDefinition inferred_schema = 3;
  SpatialReference source_spatial_reference = 4;
  Extent source_extent = 5;
}

// QualityReport summarizes data quality checks from pipeline execution.
message QualityReport {
  int64 total_records = 1;
  int64 valid_records = 2;
  int64 invalid_records = 3;
  int64 cleaned_records = 4;
  int64 deduplicated_records = 5;
  repeated QualityIssue issues = 6;
}

// QualityIssue reports a data quality problem found during pipeline execution.
message QualityIssue {
  string rule_id = 1;
  string field = 2;
  int64 affected_count = 3;
  string message = 4;
  Severity severity = 5;
}

// PublishedServiceInfo describes the service created by a publishing pipeline.
message PublishedServiceInfo {
  string service_id = 1;
  string service_url = 2;
  string service_type = 3;
  repeated FieldDefinition schema = 4;
  SpatialReference spatial_reference = 5;
}

// SubmitPipelineJobRequest submits a pipeline for asynchronous execution.
message SubmitPipelineJobRequest {
  PipelineDefinition pipeline = 1;
  ExecutionContext context = 2;
  // Optional client-generated idempotency key. When set, the server MUST treat
  // a retry carrying the same key within its dedup window as the same submission
  // and return the original job_id instead of spawning a duplicate job.
  // Recommended: a UUID per logical submission.
  string idempotency_key = 3;
}

// GetPipelineJobResultResponse returns the pipeline job result.
// The gRPC status is OK regardless of job outcome. For failed jobs, the
// error field carries the structured ErrorDetail.
message GetPipelineJobResultResponse {
  string job_id = 1;
  oneof outcome {
    PipelineResult result = 2;
    ErrorDetail error = 3;
  }
}
