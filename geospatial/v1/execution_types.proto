syntax = "proto3";

package geospatial.v1;

import "geospatial/v1/common.proto";
import "geospatial/v1/spatial_types.proto";
import "geospatial/v1/workspace_artifact_types.proto";

// Shared types for operator execution contracts across ProcessService,
// PipelineService, RenderService, BuilderService, and DeploymentService.

// WorkflowFamily identifies the category of operator workflow.
// Values are scoped to families with a defined owning service in this package.
enum WorkflowFamily {
  WORKFLOW_FAMILY_UNSPECIFIED = 0;
  WORKFLOW_FAMILY_ANALYZE = 1;
  WORKFLOW_FAMILY_PUBLISH = 2;
  WORKFLOW_FAMILY_BUILD = 3;
  WORKFLOW_FAMILY_DEPLOY = 4;
}

// JobState represents the lifecycle state of an execution job.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_DRAFT = 1;
  JOB_STATE_AWAITING_CLARIFICATION = 2;
  JOB_STATE_VALIDATED = 3;
  JOB_STATE_AWAITING_APPROVAL = 4;
  JOB_STATE_RUNNING = 5;
  JOB_STATE_COMPLETED = 6;
  JOB_STATE_FAILED = 7;
  JOB_STATE_CANCELLED = 8;
}

// StageState represents the state of an individual execution stage.
enum StageState {
  STAGE_STATE_UNSPECIFIED = 0;
  STAGE_STATE_PENDING = 1;
  STAGE_STATE_RUNNING = 2;
  STAGE_STATE_COMPLETED = 3;
  STAGE_STATE_NEEDS_USER_INPUT = 4;
  STAGE_STATE_BLOCKED = 5;
  STAGE_STATE_FAILED = 6;
  STAGE_STATE_SKIPPED = 7;
  STAGE_STATE_CANCELLED = 8;
}

// ErrorCategory classifies the domain of an execution error.
enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  ERROR_CATEGORY_VALIDATION = 1;
  ERROR_CATEGORY_AUTHORIZATION = 2;
  ERROR_CATEGORY_POLICY = 3;
  ERROR_CATEGORY_EXECUTION = 4;
  ERROR_CATEGORY_ARTIFACT = 5;
  ERROR_CATEGORY_PACKAGING = 6;
  ERROR_CATEGORY_DEPLOYMENT = 7;
}

// Retryability classifies how a failed operation may be retried.
enum Retryability {
  RETRYABILITY_UNSPECIFIED = 0;
  RETRYABILITY_FIX_PLAN_AND_RETRY = 1;
  RETRYABILITY_FIX_DATA_AND_RETRY = 2;
  RETRYABILITY_INSUFFICIENT_QUOTA = 3;
  RETRYABILITY_TRANSIENT_BACKEND_ERROR = 4;
  RETRYABILITY_PERMANENT_FAILURE = 5;
}

// ArtifactClass identifies the type of an execution artifact.
enum ArtifactClass {
  ARTIFACT_CLASS_UNSPECIFIED = 0;
  ARTIFACT_CLASS_SCALAR = 1;
  ARTIFACT_CLASS_FEATURE_LAYER = 2;
  ARTIFACT_CLASS_TABLE = 3;
  ARTIFACT_CLASS_RASTER = 4;
  ARTIFACT_CLASS_FILE = 5;
  ARTIFACT_CLASS_REPORT = 6;
  ARTIFACT_CLASS_MAP = 7;
  ARTIFACT_CLASS_APP_BUNDLE = 8;
  ARTIFACT_CLASS_SERVICE_DEFINITION = 9;
}

// ExecutionPlan describes a sequence of steps to execute.
message ExecutionPlan {
  string plan_id = 1;
  string spec_version = 2;
  WorkflowFamily workflow_family = 3;
  repeated PlanStep steps = 4;
  repeated string expected_outputs = 5;
}

// PlanStep describes a single step within an execution plan.
// Standard step kinds for analysis workflows: query_features, geoprocess,
// aggregate, render_map, export. Standard kinds should use the typed
// ParameterValue branches where a canonical message exists (e.g.,
// spatial_filter_value for query_features spatial filters).
message PlanStep {
  string step_id = 1;
  string kind = 2;
  map<string, ParameterValue> inputs = 3;
  repeated string dependencies = 4;
}

// ErrorDetail is the canonical, structured application-error type for the
// protocol. It is reused (directly or embedded) by every surface that reports a
// structured error — streaming terminal error events, feature edit failures
// (FeatureService), and spec diagnostics (SpecService) — so that clients parse
// one error shape everywhere.
//
// Fields 1-3 are the canonical core (code, message, details); fields 4-8 carry
// optional execution-context that the operator/execution surfaces populate and
// that other surfaces simply leave unset.
message ErrorDetail {
  // Numeric, machine-parseable error code. Aligned with GeoServices/Esri REST
  // error-code semantics where applicable (e.g. 400 invalid/missing parameters,
  // 403 forbidden, 404 not found, 498/499 token/auth, 500 internal server
  // error); these also line up with HTTP/gRPC status conventions. 0 means
  // unset.
  int32 code = 1;
  // Human-readable error message.
  string message = 2;
  // Additional machine-readable key/value context for the error.
  map<string, string> details = 3;
  // Domain of the error (execution surfaces).
  ErrorCategory category = 4;
  // Descriptive label for the execution phase where the error occurred.
  string phase = 5;
  // Correlates to the originating node: PlanStep.step_id (ProcessService),
  // PipelineStage.stage_id (PipelineService), or a server-chosen stage
  // identifier (RenderService, BuilderService, DeploymentService).
  string node_id = 6;
  Retryability retryability = 7;
  string suggested_action = 8;
}

// ArtifactRef identifies a produced artifact and carries the canonical typed
// handles for its owning workspace, bound retention policy, and
// materialization state. The full Artifact resource is returned by
// ArtifactService.GetArtifact.
//
// Field 5 (workspace_ref), field 6 (retention_policy_ref), and field 7
// (materialization_state) are the legacy string handles. They remain wire-
// and JSON-compatible with prior v1 releases and are deprecated in favor of
// the typed handles on fields 8, 9, and 10. When both the legacy string
// field and the typed replacement are populated, the typed replacement is
// authoritative; the legacy field, if populated, MUST describe the same
// underlying identity. Producers should populate only the typed fields on
// new writes.
message ArtifactRef {
  string artifact_id = 1;
  ArtifactClass artifact_class = 2;
  int32 artifact_version = 3;
  // Producer identifier — typically an ExecutionResult, PipelineResult,
  // RenderResult, BuildResult, or DeploymentResult job id.
  string producer_ref = 4;
  // Deprecated since v1: use `workspace` (field 8) instead. Legacy workspace
  // id retained for wire and JSON compatibility. Removal target: v2.
  string workspace_ref = 5 [deprecated = true];
  // Deprecated since v1: use `retention` (field 9) instead. Legacy retention
  // policy id retained for wire and JSON compatibility. Removal target: v2.
  string retention_policy_ref = 6 [deprecated = true];
  // Deprecated since v1: use `materialization` (field 10) instead. Legacy
  // string label retained for wire and JSON compatibility. Removal
  // target: v2.
  string materialization_state = 7 [deprecated = true];
  // Owning workspace. Carries scope and revision for drift detection.
  // Authoritative over the deprecated `workspace_ref` string.
  WorkspaceRef workspace = 8;
  // Bound retention policy. Populated when the server has resolved a
  // retention binding for the artifact. Authoritative over the deprecated
  // `retention_policy_ref` string.
  RetentionPolicyRef retention = 9;
  // Whether the artifact's bytes are materialized in the workspace backend.
  // Authoritative over the deprecated `materialization_state` string.
  MaterializationState materialization = 10;
}

// EstimatedArtifact describes an artifact expected from a dry run.
message EstimatedArtifact {
  ArtifactClass artifact_class = 1;
  int64 estimated_size_bytes = 2;
  string description = 3;
}

// SideEffect describes an external effect that execution would produce.
message SideEffect {
  string effect_type = 1;
  string target = 2;
  string description = 3;
}

// CostEstimate provides estimated resource consumption for execution.
message CostEstimate {
  string units = 1;
  double amount = 2;
}

// DryRunResult contains the estimated impact of executing a plan without side effects.
message DryRunResult {
  int64 estimated_duration_seconds = 1;
  repeated EstimatedArtifact estimated_artifacts = 2;
  repeated SideEffect side_effects = 3;
  CostEstimate cost_estimate = 4;
}

// JobProgress reports the current state of a running job.
message JobProgress {
  string job_id = 1;
  JobState state = 2;
  int32 progress_percent = 3;
  // Correlates to the originating node: PlanStep.step_id (ProcessService),
  // PipelineStage.stage_id (PipelineService), or a server-chosen stage
  // identifier (RenderService, BuilderService, DeploymentService).
  string current_node_id = 4;
  int64 started_at = 5; // UTC milliseconds since epoch
  int64 updated_at = 6; // UTC milliseconds since epoch
  string message = 7;
}

// StageResult reports the outcome of an individual execution stage.
message StageResult {
  // Correlates to the originating node: PlanStep.step_id (ProcessService),
  // PipelineStage.stage_id (PipelineService), or a server-chosen stage
  // identifier (RenderService, BuilderService, DeploymentService).
  string node_id = 1;
  StageState state = 2;
  ErrorDetail error = 3;
  repeated ArtifactRef partial_artifacts = 4;
}

// PlanValidationIssue describes a problem found during plan or pipeline validation.
message PlanValidationIssue {
  // Correlates to the originating node: PlanStep.step_id (ProcessService),
  // PipelineStage.stage_id (PipelineService), or a server-chosen stage
  // identifier (RenderService, BuilderService, DeploymentService).
  string node_id = 1;
  string field = 2;
  string message = 3;
  Severity severity = 4;
}

// Assumption records a decision or inference made during execution.
message Assumption {
  string assumption_id = 1;
  string description = 2;
  string rationale = 3;
  bool user_confirmed = 4;
}

// ProvenanceRecord captures the full execution lineage for a result.
message ProvenanceRecord {
  repeated string source_dataset_refs = 1;
  repeated string process_definition_refs = 2;
  repeated Assumption assumptions = 3;
  int64 executed_at = 4; // UTC milliseconds since epoch
  int64 duration_seconds = 5;
}

// ParameterValue represents a typed parameter for step inputs and stage config.
// Scalar, list, and struct branches handle generic parameters. Typed branches
// for canonical geospatial messages let standard step and stage kinds reference
// protocol-owned types directly instead of requiring ad-hoc struct encoding.
message ParameterValue {
  oneof kind {
    string string_value = 1;
    int64 int64_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    ParameterList list_value = 6;
    ParameterMap struct_value = 7;
    // Typed geospatial branches — reuse canonical protocol messages.
    SpatialFilter spatial_filter_value = 8;
    SpatialReference spatial_reference_value = 9;
    Geometry geometry_value = 10;
    Extent extent_value = 11;
    StatisticDefinition statistic_value = 12;
  }
}

// ParameterList is an ordered sequence of parameter values.
message ParameterList {
  repeated ParameterValue values = 1;
}

// ParameterMap is a string-keyed structure of parameter values.
message ParameterMap {
  map<string, ParameterValue> fields = 1;
}

// ExecutionContext is the shared cross-cutting request context for the
// operator execution surface (Execute* RPCs on ProcessService,
// PipelineService, RenderService, BuilderService, and DeploymentService)
// and for the WorkspaceService and ArtifactService lifecycle surface,
// including their non-mutating read and list RPCs (for example
// OpenWorkspace, GetWorkspace, ListWorkspaces, GetQuotaUsage, GetArtifact,
// InspectArtifact, ListArtifacts, GetRetentionPolicy, and
// ListRetentionPolicies). The `workspace` handle carries the canonical
// WorkspaceRef for requests that need workspace context. When the enclosing
// request already provides a resource-scoped or filter-scoped WorkspaceRef,
// that handle is authoritative for routing, artifact scope, job state, and
// authorization. On list RPCs without an active workspace selector (for
// example ListWorkspacesRequest, ListRetentionPoliciesRequest, or
// ListArtifactsRequest when the workspace filter is unset),
// `ExecutionContext.workspace` is informational only; it does not implicitly
// narrow results, and servers evaluate caller scope from request metadata.
//
// Workspace identity precedence. When the enclosing request already carries
// a WorkspaceRef elsewhere — for example `ArtifactRef.workspace`,
// `ArtifactHeader.workspace`, `WorkspaceRef ref` on WorkspaceService
// requests, `DeploymentSpec.workspace`, or a list-request workspace filter
// such as `ListArtifactsRequest.workspace` when set — that resource-scoped
// or filter handle is authoritative. If `ExecutionContext.workspace` is
// also set, it MUST identify the same workspace (matching `workspace_id`
// at minimum; servers SHOULD reject mismatched `scope_token` or
// `workspace_revision`) and the server returns INVALID_ARGUMENT on
// mismatch. Callers that already carry workspace identity on the resource
// or filter handle MAY leave `ExecutionContext.workspace` unset.
//
// Field 1 (workspace_id) is the legacy string handle retained for wire and
// JSON compatibility. It is deprecated in favor of the typed `workspace`
// handle on field 4; when both are populated they MUST identify the same
// workspace and the typed field is authoritative. Producers should populate
// only the typed field on new writes.
message ExecutionContext {
  // Deprecated since v1: use `workspace` (field 4) instead. Legacy workspace
  // id retained for wire and JSON compatibility. Removal target: v2.
  string workspace_id = 1 [deprecated = true];
  int64 timeout_seconds = 2;
  map<string, string> metadata = 3;
  // Canonical typed workspace handle for this request. Authoritative over
  // the deprecated `workspace_id` string.
  WorkspaceRef workspace = 4;
}
