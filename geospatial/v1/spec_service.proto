syntax = "proto3";

package geospatial.v1;

import "geospatial/v1/execution_types.proto";

// SpecService exposes Terraform-style plan/apply semantics for canonical
// geospatial spec documents. Plan is side-effect-free and returns the DAG shape
// plus per-node cost estimates. Apply is server-streaming and emits per-node
// progress events.
//
// Converged onto the shared execution surface (pre-v1 refactor, issue #48).
//
// SpecService now shares the job-lifecycle control-plane messages defined in
// execution_types.proto. The convergence axes:
//
//   - Identity / cancellation model. CancelApply now uses the shared
//     CancelJobRequest / CancelJobResponse keyed on job_id. The job_id is
//     emitted in each ApplySpecEvent (field 10); the historical apply_token
//     field (field 3) is reserved.
//   - Plan/cost shape. SpecCostEstimate and SpecCostActual are retired in
//     favour of DryRunResult, which is extended (fields 5-10) to carry per-
//     node row, byte, and duration estimates (fields 5-7) and per-node actual
//     execution metrics (fields 8-10). SpecPlanNode.cost uses DryRunResult;
//     ApplySpecEvent.actual_cost uses DryRunResult with the actual_* fields.
//   - Diagnostics. SpecDiagnostic is retired. ErrorDetail (extended with
//     Severity severity=9 and string remedy=10 in this release) replaces it
//     directly. SpecPlanNode.warnings, SpecPlan.warnings, and
//     ApplySpecEvent.diagnostic all use ErrorDetail.
//   - Node inputs / parameters. CanonicalSpecNode.inputs and .parameters now
//     use map<string, ParameterValue> so spec fragments are typed consistently
//     with the rest of the execution surface. source_pins remains
//     map<string, string> (content-hash values).
service SpecService {
  // Plans a canonical spec document and returns the DAG, cost estimates, and
  // any structured warnings.
  rpc PlanSpec(PlanSpecRequest) returns (PlanSpecResponse);

  // Applies a canonical spec document and streams per-node progress events.
  // The stream completes when the apply reaches a terminal state.
  rpc ApplySpec(ApplySpecRequest) returns (stream ApplySpecEvent);

  // Cooperatively cancels an in-flight apply run by job id.
  rpc CancelApply(CancelJobRequest) returns (CancelJobResponse);
}

// Plan messages.

message PlanSpecRequest {
  CanonicalSpecDocument document = 1;
}

message PlanSpecResponse {
  SpecPlan plan = 1;
}

// Apply messages.

message ApplySpecRequest {
  CanonicalSpecDocument document = 1;
  SpecCacheMode cache_mode = 2;
  uint32 max_concurrency = 3;
}

message ApplySpecEvent {
  int64 sequence = 1;
  SpecApplyEventKind kind = 2;
  // Reserved: field 3 (apply_token) retired in v0.2.0-alpha.1. Use job_id
  // (field 10) to identify the apply run for CancelApply.
  reserved 3;
  reserved "apply_token";
  optional string node_id = 4;
  optional string content_hash = 5;
  int64 timestamp_unix_ms = 6;
  optional ErrorDetail diagnostic = 7;
  // Per-node actual execution metrics. The actual_rows, actual_bytes, and
  // actual_duration_ms fields (8-10) of DryRunResult are populated here;
  // the estimate fields (1-7) are left at their defaults.
  optional DryRunResult actual_cost = 8;
  optional SpecApplySummary summary = 9;
  // Job identifier for this apply run. Use this value in CancelJobRequest
  // to cancel the in-flight apply.
  string job_id = 10;
}

// Domain messages.

message CanonicalSpecDocument {
  string grammar_version = 1;
  string process_family_version = 2;
  optional string spec_id = 3;
  repeated CanonicalSpecNode nodes = 4;
}

message CanonicalSpecNode {
  string id = 1;
  SpecResourceKind kind = 2;
  optional string op = 3;
  // Typed input parameters. Uses ParameterValue so spec fragments are
  // consistently typed across the execution surface. String fragments are
  // carried as string_value branches.
  map<string, ParameterValue> inputs = 4;
  // Typed configuration parameters. Same typing convention as inputs.
  map<string, ParameterValue> parameters = 5;
  optional string canonical_fragment = 6;
  // Content-hash pins for source references. Remains map<string, string>
  // because values are opaque hashes, not typed parameters.
  map<string, string> source_pins = 7;
  bool nondeterministic = 8;
}

message SpecPlan {
  string plan_id = 1;
  string grammar_version = 2;
  string process_family_version = 3;
  repeated SpecPlanNode nodes = 4;
  // Plan-level warnings. Uses the shared ErrorDetail with severity populated.
  repeated ErrorDetail warnings = 5;
}

message SpecPlanNode {
  string node_id = 1;
  SpecResourceKind kind = 2;
  optional string op = 3;
  repeated string depends_on = 4;
  string content_hash = 5;
  // Per-node cost estimate. The estimated_rows, estimated_bytes, and
  // estimated_duration_ms fields (5-7) of DryRunResult are populated here;
  // the operator-service estimate fields (1-4) may also be set for
  // whole-node cost envelope.
  DryRunResult cost = 6;
  // Node-level warnings. Uses the shared ErrorDetail with severity populated.
  repeated ErrorDetail warnings = 7;
}

message SpecApplySummary {
  int32 total_nodes = 1;
  int32 cached_nodes = 2;
  int32 ran_nodes = 3;
  int32 failed_nodes = 4;
  int32 skipped_nodes = 5;
  double total_duration_ms = 6;
  bool cancelled = 7;
}

// Enums.

enum SpecResourceKind {
  SPEC_RESOURCE_KIND_UNSPECIFIED = 0;
  SPEC_RESOURCE_KIND_COMPUTE = 1;
  SPEC_RESOURCE_KIND_REPORT = 2;
  SPEC_RESOURCE_KIND_DATASET = 3;
  SPEC_RESOURCE_KIND_SERVICE = 4;
  SPEC_RESOURCE_KIND_APP = 5;
}

enum SpecApplyEventKind {
  SPEC_APPLY_EVENT_KIND_UNSPECIFIED = 0;
  SPEC_APPLY_EVENT_KIND_QUEUED = 1;
  SPEC_APPLY_EVENT_KIND_RUNNING = 2;
  SPEC_APPLY_EVENT_KIND_CACHED = 3;
  SPEC_APPLY_EVENT_KIND_SUCCEEDED = 4;
  SPEC_APPLY_EVENT_KIND_FAILED = 5;
  SPEC_APPLY_EVENT_KIND_SKIPPED = 6;
  SPEC_APPLY_EVENT_KIND_WARNING = 7;
  SPEC_APPLY_EVENT_KIND_APPLY_STARTED = 8;
  SPEC_APPLY_EVENT_KIND_APPLY_COMPLETED = 9;
  SPEC_APPLY_EVENT_KIND_APPLY_CANCELLED = 10;
}

enum SpecCacheMode {
  SPEC_CACHE_MODE_UNSPECIFIED = 0;
  SPEC_CACHE_MODE_READ_WRITE = 1;
  SPEC_CACHE_MODE_READ_ONLY = 2;
  SPEC_CACHE_MODE_BYPASS = 3;
}
