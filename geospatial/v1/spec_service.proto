syntax = "proto3";

package geospatial.v1;

import "geospatial/v1/common.proto";
import "geospatial/v1/execution_types.proto";

// SpecService exposes Terraform-style plan/apply semantics for canonical
// geospatial spec documents. Plan is side-effect-free and returns the DAG shape
// plus per-node cost estimates. Apply is server-streaming and emits per-node
// progress events.
//
// Intentional divergence from the shared execution surface.
//
// SpecService shares execution_types.proto's error model (see Diagnostics
// below) but deliberately does NOT adopt the rest of the operator-execution
// contract that ProcessService, PipelineService, RenderService,
// BuilderService, and DeploymentService share. The two surfaces model
// different execution paradigms, and fully collapsing them would distort both.
// The axes below are intentional, not accidental duplication:
//
//   - Identity / cancellation model. The operator services address a single
//     submitted job by `job_id`. SpecService addresses a whole declarative
//     apply run by `apply_token` (CancelApplyRequest.apply_token) and reports
//     progress per DAG node, not per job. There is no one-to-one job handle to
//     reuse.
//   - Plan/cost shape. SpecCostEstimate / SpecCostActual express per-node row,
//     byte, and duration estimates for a dependency DAG. The shared
//     DryRunResult expresses a single whole-plan estimate (EstimatedArtifact,
//     SideEffect, CostEstimate) and has no per-node DAG dimension. They are
//     not substitutable.
//   - Diagnostics: already converged. SpecDiagnostic embeds the shared
//     ErrorDetail (numeric code, message, details, node_id) and the shared
//     Severity enum, keeping only a spec-specific `remedy` hint. This is the
//     one axis where the spec and operator surfaces deliberately share a type
//     rather than diverge; the former bespoke string code / message / node_id
//     and SpecDiagnosticSeverity were removed during the pre-v1 wire-contract
//     finalization.
//   - Node inputs. CanonicalSpecNode.inputs/parameters are intentionally
//     string maps: they hold already-canonicalized spec fragments (the spec
//     grammar is the source of truth and is hashed for caching via
//     `content_hash`/`source_pins`), not the live, typed operator parameters
//     that ParameterValue models for ad-hoc step inputs.
//
// In short, this is a separate, self-contained plan/apply subsystem by design,
// not accidental duplication of execution_types. New shared execution concepts
// belong in execution_types.proto; spec-grammar concepts belong here. Any
// future unification must be a deliberate, versioned contract change (see
// VERSIONING.md), not an incidental refactor.
service SpecService {
  // Plans a canonical spec document and returns the DAG, cost estimates, and
  // any structured warnings.
  rpc PlanSpec(PlanSpecRequest) returns (PlanSpecResponse);

  // Applies a canonical spec document and streams per-node progress events.
  // The stream completes when the apply reaches a terminal state.
  rpc ApplySpec(ApplySpecRequest) returns (stream ApplySpecEvent);

  // Cooperatively cancels an in-flight apply run by apply token.
  rpc CancelApply(CancelApplyRequest) returns (CancelApplyResponse);
}

// Plan messages.

message PlanSpecRequest {
  CanonicalSpecDocument document = 1;
}

message PlanSpecResponse {
  SpecPlan plan = 1;
}

// Apply messages.

message ApplySpecRequest {
  CanonicalSpecDocument document = 1;
  SpecCacheMode cache_mode = 2;
  uint32 max_concurrency = 3;
}

message ApplySpecEvent {
  int64 sequence = 1;
  SpecApplyEventKind kind = 2;
  string apply_token = 3;
  optional string node_id = 4;
  optional string content_hash = 5;
  int64 timestamp_unix_ms = 6;
  optional SpecDiagnostic diagnostic = 7;
  optional SpecCostActual actual_cost = 8;
  optional SpecApplySummary summary = 9;
}

message CancelApplyRequest {
  string apply_token = 1;
}

message CancelApplyResponse {
  bool cancelled = 1;
}

// Domain messages.

message CanonicalSpecDocument {
  string grammar_version = 1;
  string process_family_version = 2;
  optional string spec_id = 3;
  repeated CanonicalSpecNode nodes = 4;
}

message CanonicalSpecNode {
  string id = 1;
  SpecResourceKind kind = 2;
  optional string op = 3;
  map<string, string> inputs = 4;
  map<string, string> parameters = 5;
  optional string canonical_fragment = 6;
  map<string, string> source_pins = 7;
  bool nondeterministic = 8;
}

message SpecPlan {
  string plan_id = 1;
  string grammar_version = 2;
  string process_family_version = 3;
  repeated SpecPlanNode nodes = 4;
  repeated SpecDiagnostic warnings = 5;
}

message SpecPlanNode {
  string node_id = 1;
  SpecResourceKind kind = 2;
  optional string op = 3;
  repeated string depends_on = 4;
  string content_hash = 5;
  SpecCostEstimate cost = 6;
  repeated SpecDiagnostic warnings = 7;
}

message SpecCostEstimate {
  optional int64 estimated_rows = 1;
  optional int64 estimated_bytes = 2;
  optional double estimated_duration_ms = 3;
}

message SpecCostActual {
  optional int64 rows = 1;
  optional int64 bytes = 2;
  double duration_ms = 3;
}

message SpecApplySummary {
  int32 total_nodes = 1;
  int32 cached_nodes = 2;
  int32 ran_nodes = 3;
  int32 failed_nodes = 4;
  int32 skipped_nodes = 5;
  double total_duration_ms = 6;
  bool cancelled = 7;
}

message SpecDiagnostic {
  // Canonical error payload (numeric code, message, details, and the originating
  // node_id). Replaces the former string code / message / node_id fields and
  // converges spec diagnostics onto the one shared ErrorDetail model.
  ErrorDetail error = 1;
  // Diagnostic severity, using the shared ascending Severity enum.
  Severity severity = 2;
  // Optional remediation hint.
  optional string remedy = 3;
}

// Enums.

enum SpecResourceKind {
  SPEC_RESOURCE_KIND_UNSPECIFIED = 0;
  SPEC_RESOURCE_KIND_COMPUTE = 1;
  SPEC_RESOURCE_KIND_REPORT = 2;
  SPEC_RESOURCE_KIND_DATASET = 3;
  SPEC_RESOURCE_KIND_SERVICE = 4;
  SPEC_RESOURCE_KIND_APP = 5;
}

enum SpecApplyEventKind {
  SPEC_APPLY_EVENT_KIND_UNSPECIFIED = 0;
  SPEC_APPLY_EVENT_KIND_QUEUED = 1;
  SPEC_APPLY_EVENT_KIND_RUNNING = 2;
  SPEC_APPLY_EVENT_KIND_CACHED = 3;
  SPEC_APPLY_EVENT_KIND_SUCCEEDED = 4;
  SPEC_APPLY_EVENT_KIND_FAILED = 5;
  SPEC_APPLY_EVENT_KIND_SKIPPED = 6;
  SPEC_APPLY_EVENT_KIND_WARNING = 7;
  SPEC_APPLY_EVENT_KIND_APPLY_STARTED = 8;
  SPEC_APPLY_EVENT_KIND_APPLY_COMPLETED = 9;
  SPEC_APPLY_EVENT_KIND_APPLY_CANCELLED = 10;
}

enum SpecCacheMode {
  SPEC_CACHE_MODE_UNSPECIFIED = 0;
  SPEC_CACHE_MODE_READ_WRITE = 1;
  SPEC_CACHE_MODE_READ_ONLY = 2;
  SPEC_CACHE_MODE_BYPASS = 3;
}
