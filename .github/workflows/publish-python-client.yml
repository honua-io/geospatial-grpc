name: Publish Python Generated Client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUF_VERSION: "1.66.0"
  BUF_LINUX_X86_64_SHA256: "32e8e7b236e1b9da4eb20ad3c7701a404f7909b18d60f6d00837c63b31d4e6cf"
  PYTHON_VERSION: "3.13"

jobs:
  build-and-smoke:
    name: Build Once and Smoke
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install verified Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Derive and validate stable release contract
        id: contract
        shell: bash
        run: |
          contract="$(python3 scripts/release_contract.py --require-stable --json)"
          version="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<<"${contract}")"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            python3 scripts/release_contract.py --require-stable --tag "${GITHUB_REF_NAME}"
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Generate Python client from tagged schema
        run: |
          mkdir -p packages/python/src
          buf generate --template buf.gen.python.yaml --output packages/python/src
          touch packages/python/src/geospatial/__init__.py
          touch packages/python/src/geospatial/v1/__init__.py
          touch packages/python/src/geospatial/v1/py.typed
          cp LICENSE packages/python/LICENSE
      - name: Build and validate distributions
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r .github/requirements/python-release-tools.txt
          python -m build --no-isolation packages/python --outdir dist/python
          python -m twine check dist/python/*
      - name: Smoke install built wheel
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT
          python -m venv "${smoke_dir}/venv"
          "${smoke_dir}/venv/bin/pip" install --disable-pip-version-check dist/python/*.whl
          "${smoke_dir}/venv/bin/python" -c \
            'from geospatial.v1 import feature_service_pb2, feature_service_pb2_grpc; assert feature_service_pb2.QueryFeaturesRequest and feature_service_pb2_grpc.FeatureServiceStub'
      - name: Record checksums
        run: (cd dist/python && sha256sum * > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geospatial-grpc-python-${{ steps.contract.outputs.version }}
          path: dist/python/
          if-no-files-found: error
          retention-days: 90
      - name: Validation-only summary
        if: github.event_name == 'workflow_dispatch'
        run: echo "Validation only; only the exact ${{ steps.contract.outputs.tag }} tag publishes." >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish to PyPI
    needs: build-and-smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geospatial-grpc-python-${{ needs.build-and-smoke.outputs.version }}
          path: dist/python
      - name: Require PyPI credential and unused coordinate
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          VERSION: ${{ needs.build-and-smoke.outputs.version }}
        run: |
          test -n "${PYPI_API_TOKEN}" || { echo "PYPI_API_TOKEN is required." >&2; exit 1; }
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/geospatial-grpc/${VERSION}/json")"
          test "${status}" = "404" || { echo "PyPI coordinate is already occupied (HTTP ${status})." >&2; exit 1; }
      - name: Publish exact build artifact
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r .github/requirements/python-release-tools.txt
          python -m twine upload --non-interactive dist/python/*.whl dist/python/*.tar.gz

  prove-public-consumption:
    name: Prove Clean Public Consumption
    needs: [build-and-smoke, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geospatial-grpc-python-${{ needs.build-and-smoke.outputs.version }}
          path: local
      - name: Download and compare public artifacts
        env:
          VERSION: ${{ needs.build-and-smoke.outputs.version }}
        run: |
          for attempt in {1..24}; do
            python -m pip download --disable-pip-version-check --no-deps \
              --no-cache-dir --dest public "geospatial-grpc==${VERSION}" && break
            test "${attempt}" -lt 24 || exit 1
            sleep 10
          done
          python -m pip download --disable-pip-version-check --no-deps --no-binary :all: \
            --no-cache-dir --dest public "geospatial-grpc==${VERSION}"
          test "$(sha256sum local/*.whl | cut -d' ' -f1)" = "$(sha256sum public/*.whl | cut -d' ' -f1)"
          test "$(sha256sum local/*.tar.gz | cut -d' ' -f1)" = "$(sha256sum public/*.tar.gz | cut -d' ' -f1)"
      - name: Install anonymously from PyPI
        env:
          VERSION: ${{ needs.build-and-smoke.outputs.version }}
        run: |
          python -m venv "${RUNNER_TEMP}/public-venv"
          "${RUNNER_TEMP}/public-venv/bin/pip" install --disable-pip-version-check \
            --no-cache-dir --index-url https://pypi.org/simple "geospatial-grpc==${VERSION}"
          "${RUNNER_TEMP}/public-venv/bin/python" -c \
            'from geospatial.v1 import feature_service_pb2_grpc; assert feature_service_pb2_grpc.FeatureServiceStub'
          "${RUNNER_TEMP}/public-venv/bin/pip" check
