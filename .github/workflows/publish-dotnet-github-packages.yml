name: .NET GitHub Packages

on:
  pull_request:
    branches: [trunk]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-github-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  pack:
    name: .NET release pack dry-run
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Validate tag parser
        run: python -m unittest discover -s tests -p test_dotnet_release.py -v
      - name: Pack and verify tag-derived package (no publication)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:RELEASE_TAG
          } else {
            $tag = "v1.0.0-pr.$env:GITHUB_RUN_ID"
          }
          python scripts/pack_dotnet_release.py --tag $tag --output nupkgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-github-packages
          path: nupkgs/*.*nupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attest and publish .NET to GitHub Packages
    needs: pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'honua-io/geospatial-grpc'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-github-packages
          path: nupkgs
      - name: Attest exact package bytes before publication
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: nupkgs/*.*nupkg
      - name: Push runtime package using repository token
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath nupkgs -Filter *.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one runtime package' }
          dotnet nuget push $packages[0].FullName `
            --source https://nuget.pkg.github.com/honua-io/index.json `
            --api-key $env:GH_PACKAGES_TOKEN --no-symbols
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # No --skip-duplicate: an occupied coordinate must fail for review.
          # GitHub Packages does not host snupkg symbols; retain them above.
