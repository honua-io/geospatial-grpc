name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUF_VERSION: "1.66.0"
  DOTNET_VERSION: "10.0.x"

jobs:
  lint-and-validate:
    name: Lint and Validate Protobuf
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Lint Protobuf Files
        run: buf lint

      # Breaking-change gate (WIRE_JSON ruleset from buf.yaml). Runs on PRs
      # against the target branch AND on direct push to trunk against the most
      # recent release tag, so a wire/JSON-breaking proto edit fails CI on
      # either path. This is a required status check (see VERSIONING.md).
      - name: Check Breaking Changes (PR vs base branch)
        if: github.event_name == 'pull_request'
        run: |
          # Get the base branch
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          buf breaking --against '.git#branch=${{ github.base_ref }}'

      - name: Check Breaking Changes (push vs previous release tag)
        if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
        run: |
          # Compare the pushed trunk state against the most recent *curated*
          # release tag. Curated release tags are the conformance "v<VERSION>"
          # tags (e.g. v0.1.0-alpha.2); the per-push CI snapshot tags use the
          # distinct "ci-snapshot/" namespace (see the publish job) so they do
          # not pollute this baseline. Select the highest semver, not whatever
          # tag happened to be pushed last.
          # If no release tag exists yet, there is no baseline to break against.
          git fetch --tags --quiet
          prev_tag="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          if [[ -z "${prev_tag}" ]]; then
            echo "No prior release tag found; skipping push-time breaking check (nothing to break against yet)."
            exit 0
          fi
          echo "Checking breaking changes against previous release tag: ${prev_tag}"
          buf breaking --against ".git#tag=${prev_tag}"

      - name: Format Check
        run: buf format --diff --exit-code

      # Meta-test of the buf.yaml breaking config: proves the gate actually
      # catches RPC/service deletion and rename (RPC_NO_DELETE +
      # PACKAGE_SERVICE_NO_DELETE), so it can never silently regress to a
      # permissive WIRE_JSON-only gate. Self-contained; needs only buf + git.
      - name: Verify Breaking Gate Catches RPC/Service Removal
        run: ./conformance/breaking-gate-test.sh

  generate:
    name: Generate Code
    runs-on: ubuntu-latest
    needs: lint-and-validate

    strategy:
      matrix:
        language: [go, csharp, python, javascript, java]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Generate ${{ matrix.language }} Code
        run: |
          mkdir -p generated/${{ matrix.language }}
          case "${{ matrix.language }}" in
            go)
              buf generate --template buf.gen.go.yaml --output generated/go
              ;;
            csharp)
              buf generate --template buf.gen.csharp.yaml --output generated/csharp
              ;;
            python)
              buf generate --template buf.gen.python.yaml --output generated/python
              ;;
            javascript)
              buf generate --template buf.gen.javascript.yaml --output generated/javascript
              ;;
            java)
              buf generate --template buf.gen.java.yaml --output generated/java
              ;;
          esac

      - name: Upload Generated Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.language }}-code
          path: generated/${{ matrix.language }}/
          retention-days: 30

  generate-aggregate:
    name: Generate Code (aggregate buf.gen.yaml)
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      # Exercise the canonical aggregate template that README/getting-started
      # and the JS example tell consumers to run. The per-language matrix above
      # never touches buf.gen.yaml, so plugin/namespace drift (and the Rust,
      # Swift, and API-docs targets) would otherwise land green. Running the
      # full template here covers every configured plugin on every PR.
      - name: Generate All Languages (buf generate)
        run: buf generate --template buf.gen.yaml --output generated/all

      - name: Upload Aggregate Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-all-code
          path: generated/all/
          retention-days: 30

  examples-javascript:
    name: Build JavaScript Example
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Generate the protobuf-es client and type-check/build the example so the
      # advertised TypeScript onboarding example cannot regress. Without this the
      # per-language matrix only proves codegen runs, not that the example that
      # imports it actually compiles.
      - name: Install Example Dependencies
        working-directory: examples/javascript
        run: npm ci

      - name: Generate Client
        working-directory: examples/javascript
        run: npm run generate

      - name: Build Example (tsc)
        working-directory: examples/javascript
        run: npm run build

  publish:
    name: Publish to Buf Registry
    runs-on: ubuntu-latest
    needs: [lint-and-validate, generate, generate-aggregate]
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    environment: production
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Detect Buf registry credentials
        id: buf-auth
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          if [[ -n "${BUF_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Buf Registry
        if: steps.buf-auth.outputs.enabled == 'true'
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: echo "${BUF_TOKEN}" | buf registry login --token-stdin

      - name: Push to Buf Registry
        if: steps.buf-auth.outputs.enabled == 'true'
        run: buf push

      - name: Create Snapshot Tag
        if: steps.buf-auth.outputs.enabled == 'true'
        run: |
          # Per-push CI snapshot tag for traceability of registry pushes.
          # Lives in the dedicated "ci-snapshot/" namespace (NOT "v*") so it
          # never collides with curated release tags or the push-time breaking
          # baseline. TAG is a pure function of date+SHA, so guard creation to
          # keep workflow re-runs idempotent (mirrors the fixture-release guard
          # below): on a re-run for the same commit/day the tag already exists
          # and we skip instead of failing the publish job.
          TAG="ci-snapshot/$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Snapshot tag ${TAG} already exists; skipping."
          else
            echo "Creating tag: ${TAG}"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report skipped publish
        if: steps.buf-auth.outputs.enabled != 'true'
        run: echo "BUF_TOKEN is not configured; skipping Buf registry publish."

      # --- Versioned conformance fixtures release ---------------------------
      # Package conformance/{fixtures,golden,manifest,run.sh} into a versioned,
      # downloadable tarball and attach it to a GitHub Release tagged
      # v<conformance/VERSION>. This is the source-of-truth artifact downstream
      # SDK CI jobs pin and pull via conformance/fetch-fixtures.sh. The release
      # version equals the .NET package <Version> (enforced by
      # conformance/check-version.sh), so a fixture set maps 1:1 to a schema
      # release. Idempotent: skips if the release tag already exists.
      - name: Verify fixture version consistency
        run: ./conformance/check-version.sh

      - name: Resolve fixture release version
        id: fixver
        run: |
          version="$(tr -d '[:space:]' < conformance/VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether fixture release already exists
        id: relcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.fixver.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} already exists; will not re-publish fixtures."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package conformance fixtures
        if: steps.relcheck.outputs.exists != 'true'
        run: ./conformance/package.sh --output dist

      - name: Create fixture release and upload artifact
        if: steps.relcheck.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.fixver.outputs.version }}"
          tag="${{ steps.fixver.outputs.tag }}"
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "geospatial-grpc ${tag}" \
            --notes "Conformance fixtures for geospatial.v1 schema release ${tag}.

          Download the pinned fixture set with conformance/fetch-fixtures.sh --version ${version}
          or directly from the \`conformance-fixtures-${version}.tar.gz\` asset below.
          Verify with the accompanying \`.sha256\`." \
            "dist/conformance-fixtures-${version}.tar.gz" \
            "dist/conformance-fixtures-${version}.tar.gz.sha256"
          echo "Published fixture release ${tag}."

  validate-schemas:
    name: Validate Protocol Schemas
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Export Schema Descriptors
        run: |
          mkdir -p descriptors
          buf build -o descriptors/image.bin
          buf build -o descriptors/image.json

      - name: Upload Schema Descriptors
        uses: actions/upload-artifact@v7
        with:
          name: protocol-descriptors
          path: descriptors/
          retention-days: 90

  conformance:
    name: Conformance Fixtures
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Check Fixture Version Consistency
        run: ./conformance/check-version.sh

      - name: Run Conformance Harness
        run: ./conformance/run.sh

      - name: Package Fixtures (smoke)
        run: ./conformance/package.sh --output dist

      - name: Verify Packaged Fixtures Round-trip
        run: |
          # The published artifact must contain exactly the fixtures the harness
          # validates: extract the just-built tarball and run the bundled harness
          # against the live schema descriptor.
          version="$(tr -d '[:space:]' < conformance/VERSION)"
          buf build -o "${RUNNER_TEMP}/image.binpb"
          mkdir -p "${RUNNER_TEMP}/bundle"
          tar -C "${RUNNER_TEMP}/bundle" -xzf "dist/conformance-fixtures-${version}.tar.gz"
          CONFORMANCE_IMAGE="${RUNNER_TEMP}/image.binpb" \
            "${RUNNER_TEMP}/bundle/conformance-fixtures-${version}/run.sh"

      - name: Upload Conformance Fixtures Artifact
        uses: actions/upload-artifact@v7
        with:
          name: conformance-fixtures
          path: dist/conformance-fixtures-*
          retention-days: 90

  dotnet-package:
    name: Pack .NET Protocol Package
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack Geospatial.Grpc
        run: |
          dotnet pack src/Geospatial.Grpc/Geospatial.Grpc.csproj \
            --configuration Release \
            -o nupkgs \
            /p:TreatWarningsAsErrors=true

      - name: Upload .NET package artifact
        uses: actions/upload-artifact@v7
        with:
          name: geospatial-grpc-dotnet-package
          path: nupkgs/
          retention-days: 30

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [lint-and-validate, generate, examples-javascript, validate-schemas, conformance, dotnet-package, publish]
    if: |
      always() &&
      needs.lint-and-validate.result == 'success' &&
      needs.generate.result == 'success' &&
      needs.examples-javascript.result == 'success' &&
      needs.validate-schemas.result == 'success' &&
      needs.conformance.result == 'success' &&
      needs.dotnet-package.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')

    steps:
      - name: Success Notification
        run: |
          echo "✅ Geospatial gRPC protocol validation completed successfully"
          echo "  - Protobuf files validated and formatted"
          echo "  - Multi-language code generation verified"
          echo "  - Schema descriptors exported"
          echo "  - .NET protocol package packed"
          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            echo "  - Published to Buf Registry"
          elif [[ "${{ needs.publish.result }}" == "skipped" ]]; then
            echo "  - Buf publish skipped (credentials not configured)"
          fi
