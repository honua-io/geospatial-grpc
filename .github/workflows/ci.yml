name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUF_VERSION: "1.66.0"
  BUF_LINUX_X86_64_SHA256: "32e8e7b236e1b9da4eb20ad3c7701a404f7909b18d60f6d00837c63b31d4e6cf"
  DOTNET_VERSION: "10.0.x"

jobs:
  lint-and-validate:
    name: Lint and Validate Protobuf
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Lint Protobuf Files
        run: buf lint

      # Breaking-change gate (WIRE_JSON ruleset from buf.yaml). Runs on PRs
      # against the target branch AND on direct push to trunk against the most
      # recent release tag, so a wire/JSON-breaking proto edit fails CI on
      # either path. Repository rules should require this job (see
      # VERSIONING.md).
      - name: Check Breaking Changes (PR vs base branch)
        if: github.event_name == 'pull_request'
        run: |
          # Get the base branch
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          buf breaking --against '.git#branch=${{ github.base_ref }}'

      - name: Check Breaking Changes (push vs previous release tag)
        if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
        run: |
          # Compare the pushed trunk state against the most recent *curated*
          # release tag. Curated release tags are the conformance "v<VERSION>"
          # tags (e.g. v0.1.0-alpha.2). Select the highest semver, not whatever
          # tag happened to be pushed last.
          # If no release tag exists yet, there is no baseline to break against.
          git fetch --tags --quiet
          prev_tag="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          if [[ -z "${prev_tag}" ]]; then
            echo "No prior release tag found; skipping push-time breaking check (nothing to break against yet)."
            exit 0
          fi
          echo "Checking breaking changes against previous release tag: ${prev_tag}"
          buf breaking --against ".git#tag=${prev_tag}"

      - name: Format Check
        run: buf format --diff --exit-code

      - name: Verify release tooling
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/release_contract.py --json

      # Meta-test of the buf.yaml breaking config: proves the gate actually
      # catches RPC/service deletion and rename (RPC_NO_DELETE +
      # PACKAGE_SERVICE_NO_DELETE), so it can never silently regress to a
      # permissive WIRE_JSON-only gate. Self-contained; needs only buf + git.
      - name: Verify Breaking Gate Catches RPC/Service Removal
        run: ./conformance/breaking-gate-test.sh

  generate:
    name: Generate Code
    runs-on: ubuntu-latest
    needs: lint-and-validate

    strategy:
      matrix:
        language: [go, csharp, python, javascript, java]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Generate ${{ matrix.language }} Code
        run: |
          mkdir -p generated/${{ matrix.language }}
          case "${{ matrix.language }}" in
            go)
              buf generate --template buf.gen.go.yaml --output generated/go
              ;;
            csharp)
              buf generate --template buf.gen.csharp.yaml --output generated/csharp
              ;;
            python)
              buf generate --template buf.gen.python.yaml --output generated/python
              ;;
            javascript)
              buf generate --template buf.gen.javascript.yaml --output generated/javascript
              ;;
            java)
              buf generate --template buf.gen.java.yaml --output generated/java
              ;;
          esac

      - name: Upload Generated Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-${{ matrix.language }}-code
          path: generated/${{ matrix.language }}/
          retention-days: 30

  generate-aggregate:
    name: Generate Code (aggregate buf.gen.yaml)
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      # Exercise the canonical aggregate template that README/getting-started
      # and the JS example tell consumers to run. The per-language matrix above
      # never touches buf.gen.yaml, so plugin/namespace drift (and the Rust,
      # Swift, and API-docs targets) would otherwise land green. Running the
      # full template here covers every configured plugin on every PR.
      - name: Generate All Languages (buf generate)
        run: buf generate --template buf.gen.yaml --output generated/all

      - name: Upload Aggregate Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-all-code
          path: generated/all/
          retention-days: 30

  python-client-package:
    name: Pack Python Generated Client
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Generate and pack client
        run: |
          mkdir -p packages/python/src
          buf generate --template buf.gen.python.yaml --output packages/python/src
          touch packages/python/src/geospatial/__init__.py
          touch packages/python/src/geospatial/v1/__init__.py
          touch packages/python/src/geospatial/v1/py.typed
          cp LICENSE packages/python/LICENSE
          python -m pip install --disable-pip-version-check --require-hashes \
            -r .github/requirements/python-release-tools.txt
          python -m build --no-isolation packages/python --outdir dist/python
          python -m twine check dist/python/*
          python -m pip install --disable-pip-version-check --no-deps --target "${RUNNER_TEMP}/python-client" dist/python/*.whl
          PYTHONPATH="${RUNNER_TEMP}/python-client" python -c \
            'from geospatial.v1 import feature_service_pb2_grpc; assert feature_service_pb2_grpc.FeatureServiceStub'

  typescript-client-package:
    name: Pack TypeScript Generated Client
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Generate, compile, and pack client
        run: |
          mkdir -p packages/typescript/src dist/typescript
          buf generate --template buf.gen.typescript-package.yaml --output packages/typescript/src
          cp LICENSE packages/typescript/LICENSE
          npm ci --prefix packages/typescript
          npm run build --prefix packages/typescript
          (cd packages/typescript && npm pack --pack-destination ../../dist/typescript)
      - name: Smoke install packed client
        run: |
          smoke_dir="$(mktemp -d)"
          package_version="$(node -p "require('./packages/typescript/package.json').version")"
          node .github/scripts/prepare-typescript-smoke.mjs "${smoke_dir}" \
            "${GITHUB_WORKSPACE}/dist/typescript/honua-geospatial-grpc-${package_version}.tgz" "${package_version}"
          npm ci --ignore-scripts --prefix "${smoke_dir}"
          cd "${smoke_dir}"
          node --input-type=module -e \
            'import("@honua/geospatial-grpc/geospatial/v1/feature_service_pb.js").then(m => { if (!m.FeatureService) process.exit(1); })'

  examples-javascript:
    name: Build JavaScript Example
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # Generate the protobuf-es client and type-check/build the example so the
      # advertised TypeScript onboarding example cannot regress. Without this the
      # per-language matrix only proves codegen runs, not that the example that
      # imports it actually compiles.
      - name: Install Example Dependencies
        working-directory: examples/javascript
        run: npm ci

      - name: Generate Client
        working-directory: examples/javascript
        run: npm run generate

      - name: Build Example (tsc)
        working-directory: examples/javascript
        run: npm run build

  validate-schemas:
    name: Validate Protocol Schemas
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Export Schema Descriptors
        run: |
          mkdir -p descriptors
          buf build -o descriptors/image.bin
          buf build -o descriptors/image.json

      - name: Upload Schema Descriptors
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-descriptors
          path: descriptors/
          retention-days: 90

  conformance:
    name: Conformance Fixtures
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Buf CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_LINUX_X86_64_SHA256}" "${RUNNER_TEMP}/buf" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/buf"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Check Fixture Version Consistency
        run: ./conformance/check-version.sh

      - name: Run Conformance Harness
        run: ./conformance/run.sh

      - name: Package Fixtures (smoke)
        run: ./conformance/package.sh --output dist

      - name: Verify Packaged Fixtures Round-trip
        run: |
          # The published artifact must contain exactly the fixtures the harness
          # validates: extract the just-built tarball and run the bundled harness
          # against the live schema descriptor.
          version="$(tr -d '[:space:]' < conformance/VERSION)"
          buf build -o "${RUNNER_TEMP}/image.binpb"
          mkdir -p "${RUNNER_TEMP}/bundle"
          tar -C "${RUNNER_TEMP}/bundle" -xzf "dist/conformance-fixtures-${version}.tar.gz"
          CONFORMANCE_IMAGE="${RUNNER_TEMP}/image.binpb" \
            "${RUNNER_TEMP}/bundle/conformance-fixtures-${version}/run.sh"

      - name: Upload Conformance Fixtures Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-fixtures
          path: dist/conformance-fixtures-*
          retention-days: 90

  dotnet-package:
    name: Pack .NET Protocol Package
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack Geospatial.Grpc
        run: |
          dotnet pack src/Geospatial.Grpc/Geospatial.Grpc.csproj \
            --configuration Release \
            -o nupkgs \
            /p:TreatWarningsAsErrors=true

      - name: Upload .NET package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geospatial-grpc-dotnet-package
          path: nupkgs/
          retention-days: 30

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [lint-and-validate, generate, generate-aggregate, examples-javascript, validate-schemas, conformance, dotnet-package]
    if: |
      always() &&
      needs.lint-and-validate.result == 'success' &&
      needs.generate.result == 'success' &&
      needs.generate-aggregate.result == 'success' &&
      needs.examples-javascript.result == 'success' &&
      needs.validate-schemas.result == 'success' &&
      needs.conformance.result == 'success' &&
      needs.dotnet-package.result == 'success'

    steps:
      - name: Success Notification
        run: |
          echo "✅ Geospatial gRPC protocol validation completed successfully"
          echo "  - Protobuf files validated and formatted"
          echo "  - Multi-language code generation verified"
          echo "  - Schema descriptors exported"
          echo "  - .NET protocol package packed"
