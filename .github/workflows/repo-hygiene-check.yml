name: Repository hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# No concurrency group: this is a required check, and a cancelled run left as the
# newest check run of that name blocks merging even when another run passed (a rerun
# of an older run cancels the newer one). Runs take seconds, so every run completes.

jobs:
  repo-hygiene:
    uses: honua-io/.github/.github/workflows/repo-hygiene.yml@226dd452b184ec2908052e283490a08151c284bf
